<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">BigSwitchCase — tab-release openings</title>
  <desc id="desc">
    Top and side views of the Big Switch case. Square openings on opposite side walls
    let a small flat screwdriver reach the switch retention tabs so the Kailh Big Switch
    can be released from the base.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
    <style>
      .title { font: 700 22px Segoe UI, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .subtitle { font: 400 13px Segoe UI, Helvetica, Arial, sans-serif; fill: #555; }
      .label { font: 600 13px Segoe UI, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .note { font: 400 12px Segoe UI, Helvetica, Arial, sans-serif; fill: #333; }
      .caption { font: 600 12px Segoe UI, Helvetica, Arial, sans-serif; fill: #2c3e50; }
      .dim { font: 400 11px Segoe UI, Helvetica, Arial, sans-serif; fill: #666; }
      .case-fill { fill: #e8eef5; stroke: #2c3e50; stroke-width: 2.5; }
      .inner { fill: #f7fafc; stroke: #5d6d7e; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .opening { fill: #1a1a1a; stroke: #c0392b; stroke-width: 2; }
      .tab { fill: #f39c12; stroke: #b9770e; stroke-width: 1.2; }
      .switch { fill: #d5dbdb; stroke: #2c3e50; stroke-width: 1.8; }
      .keycap { fill: #5dade2; stroke: #2874a6; stroke-width: 1.8; }
      .driver { fill: #95a5a6; stroke: #2c3e50; stroke-width: 1.4; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .callout { fill: #fff5f5; stroke: #c0392b; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="960" height="620" fill="#fafbfc"/>

  <text x="40" y="42" class="title">BigSwitchCase — switch tab release</text>
  <text x="40" y="64" class="subtitle">Square openings on either side of the base · insert a small flat screwdriver to push the tabs in</text>

  <!-- ========== TOP VIEW ========== -->
  <g transform="translate(60,100)">
    <rect class="panel" x="-20" y="-30" width="420" height="380" rx="8"/>
    <text x="190" y="-8" text-anchor="middle" class="caption">TOP VIEW (looking down into the case)</text>

    <!-- outer case ~ square -->
    <rect class="case-fill" x="50" y="40" width="280" height="280" rx="10"/>
    <!-- inner cavity -->
    <rect class="inner" x="90" y="80" width="200" height="200" rx="6"/>

    <!-- switch body (square) -->
    <rect class="switch" x="130" y="120" width="120" height="120" rx="4"/>
    <!-- keycap hint -->
    <rect class="keycap" x="148" y="138" width="84" height="84" rx="6"/>
    <text x="190" y="186" text-anchor="middle" class="dim">keycap</text>

    <!-- retention tabs left/right -->
    <rect class="tab" x="118" y="168" width="12" height="24" rx="2"/>
    <rect class="tab" x="250" y="168" width="12" height="24" rx="2"/>
    <text x="124" y="210" text-anchor="middle" class="dim">tab</text>
    <text x="256" y="210" text-anchor="middle" class="dim">tab</text>

    <!-- square openings in outer walls -->
    <rect class="opening" x="50" y="172" width="14" height="16" rx="1"/>
    <rect class="opening" x="316" y="172" width="14" height="16" rx="1"/>

    <!-- screwdriver left -->
    <g transform="translate(0,180)">
      <rect class="driver" x="-5" y="-4" width="55" height="8" rx="2"/>
      <polygon class="driver" points="50,-6 68,0 50,6"/>
      <text x="30" y="-12" text-anchor="middle" class="note">screwdriver</text>
    </g>
    <!-- screwdriver right -->
    <g transform="translate(380,180)">
      <rect class="driver" x="-50" y="-4" width="55" height="8" rx="2"/>
      <polygon class="driver" points="-50,-6 -68,0 -50,6"/>
      <text x="-25" y="-12" text-anchor="middle" class="note">screwdriver</text>
    </g>

    <!-- arrows into openings / onto tabs -->
    <line x1="68" y1="180" x2="118" y2="180" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="312" y1="180" x2="262" y2="180" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>

    <!-- labels for openings -->
    <text x="57" y="160" text-anchor="middle" class="label" fill="#c0392b">opening</text>
    <text x="323" y="160" text-anchor="middle" class="label" fill="#c0392b">opening</text>

    <text x="190" y="340" text-anchor="middle" class="note">Push both tabs inward → lift the switch straight up out of the base</text>
  </g>

  <!-- ========== SIDE VIEW ========== -->
  <g transform="translate(520,100)">
    <rect class="panel" x="-20" y="-30" width="420" height="380" rx="8"/>
    <text x="190" y="-8" text-anchor="middle" class="caption">SIDE VIEW (one wall)</text>

    <!-- case side silhouette -->
    <rect class="case-fill" x="80" y="50" width="220" height="240" rx="8"/>
    <!-- top rim / keycap sticking out -->
    <rect class="keycap" x="130" y="20" width="120" height="40" rx="6"/>
    <text x="190" y="45" text-anchor="middle" class="dim">keycap</text>

    <!-- square opening on side wall -->
    <rect class="opening" x="172" y="145" width="36" height="36" rx="2"/>
    <text x="190" y="168" text-anchor="middle" class="label" fill="#fff">□</text>

    <!-- tab visible through opening (dashed) -->
    <rect class="tab" x="182" y="155" width="16" height="16" rx="1" opacity="0.9"/>

    <!-- screwdriver approaching opening -->
    <g transform="translate(40,163)">
      <rect class="driver" x="0" y="-5" width="90" height="10" rx="2"/>
      <polygon class="driver" points="90,-7 118,0 90,7"/>
      <text x="45" y="-14" text-anchor="middle" class="note">small flat blade</text>
    </g>
    <line x1="160" y1="163" x2="172" y2="163" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>

    <!-- callout box -->
    <rect class="callout" x="40" y="280" width="300" height="58" rx="6"/>
    <text x="190" y="302" text-anchor="middle" class="label" fill="#c0392b">Release opening</text>
    <text x="190" y="320" text-anchor="middle" class="note">Insert blade · press tab inward ·</text>
    <text x="190" y="336" text-anchor="middle" class="note">repeat on the opposite side · lift switch out</text>
  </g>

  <!-- footer -->
  <text x="40" y="560" class="note">Print file: BigSwitchCase.stl  ·  OpenSCAD: BigSwitchCase.scad  ·  Outer envelope ≈ 84 × 84 × 65 mm</text>
  <text x="40" y="582" class="note">Compatible switch: Kailh Big Switch series (Adafruit “Big Switches”, category 571) · Do not force the switch — always use both openings.</text>
  <text x="40" y="604" class="dim">kb2040-single-key hardware · release-tab access diagram</text>
</svg>
